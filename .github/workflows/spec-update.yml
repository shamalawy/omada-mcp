name: Spec update

# Weekly: fetch TP-Link's latest Omada Open API spec and open a pull request if it changed.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git show HEAD:spec/omada-openapi.json > "$RUNNER_TEMP/old-spec.json"
      - run: npm run update-spec
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- spec/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The spec has not changed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test with the new spec
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm test
          npm run docs:gen
      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=automation/spec-update
          npx tsx scripts/spec-diff.ts "$RUNNER_TEMP/old-spec.json" spec/omada-openapi.json > "$RUNNER_TEMP/body.md"
          {
            echo
            echo "Tests passed with the new spec in [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo "Pull requests opened by GitHub Actions don't start CI on their own: close and reopen this one to run it."
          } >> "$RUNNER_TEMP/body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add spec/omada-openapi.json
          git commit -m "Update bundled Omada Open API spec"
          git push --force origin "$branch"
          if [ "$(gh pr view "$branch" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$branch" --base main --title "Update bundled Omada Open API spec" --body-file "$RUNNER_TEMP/body.md"
          fi
